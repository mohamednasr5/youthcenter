name: Build karate players gallery manifest

on:
  push:
    branches: [main]
    paths:
      - "karate-academy/assets/images/players/**"
      - ".github/workflows/karate-players-manifest.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Generate manifest for every karate player image
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path("karate-academy/assets/images/players")
          root.mkdir(parents=True, exist_ok=True)
          allowed = {".jpg", ".jpeg", ".png", ".webp", ".avif"}
          images = [
              {
                  "src": f"assets/images/players/{p.name}",
                  "caption": "لاعب من أكاديمية الكاراتيه"
              }
              for p in root.iterdir()
              if p.is_file() and p.suffix.lower() in allowed
          ]
          images.sort(key=lambda item: item["src"].casefold())
          (root / "players-manifest.json").write_text(
              json.dumps({"images": images}, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8"
          )
          print(f"Indexed {len(images)} karate player images.")
          PY
      - name: Commit manifest when changed
        run: |
          if git diff --quiet -- karate-academy/assets/images/players/players-manifest.json; then
            echo "Karate players manifest is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add karate-academy/assets/images/players/players-manifest.json
          git commit -m "chore: update karate players gallery manifest"
          git push
