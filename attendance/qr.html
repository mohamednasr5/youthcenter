<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>رمز اللاعب | مركز شباب الأحمدية</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#0b1020;color:#f7f8fc;font-family:Cairo,Arial,sans-serif}.card{width:min(430px,100%);padding:26px;border:1px solid #ffffff25;border-radius:24px;background:linear-gradient(145deg,#1a2740,#10182b);text-align:center;box-shadow:0 24px 70px #0008}.logo{font-size:30px}.label{color:#9be7cb;font-weight:800;font-size:13px}.name{margin:8px 0;font-size:25px}.meta{color:#b5c5da;line-height:1.9;font-size:14px}.qr{width:min(280px,80vw);height:auto;display:block;margin:20px auto;padding:10px;background:#fff;border-radius:12px}.hint{font-size:12px;color:#9daec5;line-height:1.9}.invalid{color:#fca5a5}@media print{body{background:#fff;color:#111}.card{box-shadow:none;border:1px solid #bbb;background:#fff;color:#111}.meta,.hint{color:#333}.label{color:#08734a}}
</style></head><body><main class="card" id="card"><div class="logo">🏛️</div><div class="label">مركز شباب الأحمدية</div><h1 class="name" id="name">جارٍ تحميل بيانات اللاعب</h1><div class="meta" id="meta"></div><img class="qr" id="qr" alt="رمز QR للحضور"><p class="hint">هذا الرمز معرّف للاعب المحدد فقط، ولا يحتوي على بيانات شخصية أو رقم هاتف.</p><button id="print" onclick="window.print()">طباعة الرمز</button></main><script>
(async()=>{const q=new URLSearchParams(location.search),a=q.get("academy"),id=q.get("player"),map={football:"كرة القدم",karate:"الكاراتيه",kungfu:"الكونغ فو",nasheed:"الإنشاد"};const n=document.querySelector("#name"),m=document.querySelector("#meta"),img=document.querySelector("#qr");if(!map[a]||!id||!/^[^.#$\\[\\]/]{1,120}$/.test(id)){n.textContent="رابط رمز غير صالح";m.className="meta invalid";m.textContent="تحقق من الرابط الصادر من بوابة ولي الأمر.";img.hidden=true;return;}n.textContent="رمز اللاعب";m.textContent=map[a]+" · رقم اللاعب "+id;const self=location.origin+"/attendance/qr.html?academy="+encodeURIComponent(a)+"&player="+encodeURIComponent(id);img.src="https://api.qrserver.com/v1/create-qr-code/?size=720x720&margin=18&data="+encodeURIComponent(self);img.onerror=()=>{m.textContent+=" · تعذر تحميل صورة الرمز";};})();
</script></body></html>
