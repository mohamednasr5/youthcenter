<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#070b16">
  <meta name="robots" content="noindex,follow">
  <title>404 — الصفحة غير موجودة | مركز شباب الأحمدية</title>
  <link rel="icon" href="assets/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root{color-scheme:dark;--gold:#fbbf24;--green:#10b981;--ink:#070b16;--muted:#aab4c8}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;overflow:hidden;background:radial-gradient(ellipse at 50% 0%,rgba(245,158,11,.16),transparent 45%),radial-gradient(ellipse at 85% 80%,rgba(16,185,129,.12),transparent 38%),linear-gradient(145deg,#080d19,#101b30 58%,#070b16);color:#fff;font-family:'Cairo',system-ui,sans-serif;display:grid;place-items:center;padding:24px}
    .page{width:min(920px,100%);text-align:center;position:relative}
    .brand{display:inline-flex;align-items:center;gap:12px;margin-bottom:8px;color:#fff;text-decoration:none;font-weight:900;font-size:1rem}
    .brand img{width:48px;height:48px;object-fit:contain;filter:drop-shadow(0 5px 18px rgba(245,158,11,.3))}
    .eyebrow{color:var(--gold);font-size:.8rem;font-weight:900;letter-spacing:2px;margin:8px 0}
    h1{font-size:clamp(2rem,6vw,4rem);line-height:1.12;margin:6px 0 12px;font-weight:900}
    h1 span{color:var(--gold);text-shadow:0 0 28px rgba(251,191,36,.2)}
    .lead{max-width:660px;margin:0 auto;color:#d3d9e5;font-size:clamp(.98rem,2.3vw,1.2rem);line-height:1.9}
    .pitch{height:270px;max-width:760px;margin:18px auto 12px;position:relative;isolation:isolate}
    .pitch:before{content:"";position:absolute;left:5%;right:5%;bottom:24px;height:2px;background:linear-gradient(90deg,transparent,rgba(16,185,129,.65),transparent);box-shadow:0 0 22px rgba(16,185,129,.4)}
    .goal{position:absolute;right:10%;bottom:26px;width:220px;height:170px;border:7px solid #e8edf5;border-bottom:0;border-radius:7px 7px 0 0;transform:perspective(500px) rotateY(-7deg);filter:drop-shadow(0 0 18px rgba(255,255,255,.14))}
    .goal:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 21px,rgba(220,230,245,.27) 22px 23px),repeating-linear-gradient(0deg,transparent 0 19px,rgba(220,230,245,.25) 20px 21px);transform:skewY(-3deg);transform-origin:top}
    .goal:after{content:"";position:absolute;left:-12px;right:-12px;bottom:-5px;height:6px;background:#e8edf5;border-radius:8px}
    .net{position:absolute;inset:0;transform-origin:center;opacity:.8}
    .goal.shake{animation:netShake .55s ease-out 2}
    .keeper-shadow{position:absolute;right:calc(10% + 70px);bottom:28px;width:72px;height:116px;opacity:0;filter:drop-shadow(0 0 8px rgba(251,191,36,.35))}
    .keeper-shadow:before{content:"";position:absolute;left:22px;top:0;width:28px;height:28px;border-radius:50%;background:#fbbf24}
    .keeper-shadow:after{content:"";position:absolute;left:8px;top:29px;width:58px;height:78px;border-radius:18px 18px 7px 7px;background:linear-gradient(135deg,#f59e0b,#b45309);clip-path:polygon(25% 0,75% 0,100% 100%,0 100%)}
    .ball{position:absolute;z-index:4;left:10%;bottom:28px;width:54px;height:54px;filter:drop-shadow(0 12px 8px rgba(0,0,0,.45));animation:shoot 2.35s cubic-bezier(.18,.72,.2,1) .35s both}
    .ball svg{width:100%;height:100%;animation:spin .6s linear infinite}
    .goal-label{position:absolute;right:10%;bottom:7px;width:220px;color:#aebbd0;font-size:.7rem;font-weight:800;letter-spacing:3px}
    .goal-text{position:absolute;top:8px;left:50%;transform:translateX(-50%) scale(.4);font-size:clamp(2.2rem,8vw,4rem);font-weight:900;color:var(--gold);text-shadow:0 0 25px rgba(251,191,36,.65);opacity:0;white-space:nowrap;animation:goalPop .5s ease-out 2.35s forwards}
    .actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:22px}
    .btn{min-height:48px;padding:11px 22px;border-radius:13px;text-decoration:none;font-weight:900;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .2s,box-shadow .2s}
    .btn:hover{transform:translateY(-3px)}
    .primary{background:linear-gradient(135deg,#fbbf24,#d97706);color:#211505;box-shadow:0 10px 28px rgba(245,158,11,.22)}
    .secondary{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);color:#fff}
    .foot{margin-top:28px;color:#7f8ba2;font-size:.76rem}
    @keyframes shoot{0%{left:9%;bottom:27px;transform:translate(0,0) scale(1) rotate(0)}38%{left:38%;bottom:150px;transform:translate(0,0) scale(.88) rotate(420deg)}70%{left:69%;bottom:112px;transform:translate(0,0) scale(.68) rotate(850deg)}86%{left:81%;bottom:86px;transform:translate(0,0) scale(.58) rotate(1050deg)}100%{left:84%;bottom:78px;transform:translate(0,0) scale(.55) rotate(1120deg)}}
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes netShake{0%,100%{transform:perspective(500px) rotateY(-7deg) translateX(0)}25%{transform:perspective(500px) rotateY(-7deg) translateX(7px)}50%{transform:perspective(500px) rotateY(-7deg) translateX(-6px)}75%{transform:perspective(500px) rotateY(-7deg) translateX(4px)}}
    @keyframes goalPop{to{opacity:1;transform:translateX(-50%) scale(1)}}
    @media(max-width:560px){body{padding:18px}.pitch{height:220px;margin-top:14px}.goal{width:155px;height:125px;right:6%;border-width:5px}.goal-label{right:6%;width:155px}.ball{width:43px;height:43px;animation-name:shootMobile}.keeper-shadow{display:none}@keyframes shootMobile{0%{left:4%;bottom:27px;transform:scale(1) rotate(0)}45%{left:38%;bottom:125px;transform:scale(.8) rotate(500deg)}78%{left:73%;bottom:87px;transform:scale(.62) rotate(900deg)}100%{left:78%;bottom:72px;transform:scale(.55) rotate(1120deg)}}}
    @media(prefers-reduced-motion:reduce){.ball{animation:none;left:84%;bottom:78px;transform:scale(.55)}.ball svg{animation:none}.goal-text{animation:none;opacity:1;transform:translateX(-50%) scale(1)}.goal{animation:none}}
  </style>
</head>
<body>
  <main class="page">
    <a class="brand" href="./"><img src="assets/logo.png" alt="شعار مركز شباب الأحمدية"><span>مركز شباب الأحمدية</span></a>
    <div class="eyebrow">AHMADIAH YOUTH CENTER • 404</div>
    <h1>أوووه! <span>خارج الملعب</span></h1>
    <p class="lead">الصفحة المطلوبة غير موجودة… بس إحنا في مركز شباب الأحمدية موجودين دايمًا!<br>خلّينا نرجعك للملعب الصحيح.</p>
    <section class="pitch" aria-label="كرة تسدد وتسجل هدفًا في المرمى">
      <div class="goal" id="goal"><div class="net"></div></div>
      <div class="goal-label">AHMADIAH • GOAL</div>
      <div class="goal-text">جوووووول! ⚽</div>
      <div class="keeper-shadow"></div>
      <div class="ball" aria-hidden="true">
        <svg viewBox="0 0 100 100">
          <circle cx="50" cy="50" r="47" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/>
          <path d="M50 28 66 40 60 59 40 59 34 40Z" fill="#111827"/>
          <path d="m50 28 1-20M66 40l22-8M60 59l13 22M40 59 27 81M34 40 12 32" stroke="#111827" stroke-width="5" fill="none"/>
          <path d="M50 8 35 13 24 27 12 32 8 50 18 69 27 81 44 94 62 94 73 81 88 68 94 49 88 32 76 19 65 12Z" fill="none" stroke="#111827" stroke-width="3"/>
        </svg>
      </div>
    </section>
    <nav class="actions" aria-label="التنقل">
      <a class="btn primary" href="./">🏠 العودة إلى الرئيسية</a>
      <a class="btn secondary" href="charity-wall/">🧱 حائط الخير</a>
    </nav>
    <p class="foot">مركز شباب الأحمدية — المنزلة، الدقهلية · نورتنا في أي وقت 💚</p>
  </main>
  <script>
    const goal=document.getElementById('goal');
    window.setTimeout(()=>goal.classList.add('shake'),2250);
  </script>
</body>
</html>
